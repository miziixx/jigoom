name: Build 지금 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/goal-app-mvp-sj7lun
      - claude/jigeum-google-calendar-sync-lqeo5b
    paths:
      - 'jigeum/**'
      - '.github/workflows/jigeum-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jigeum

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform scaffold
        run: |
          flutter create --org com.ziia --project-name jigeum --platforms android .
          # flutter create 가 넣는 기본 위젯 테스트(MyApp 참조)는 제거 — 우리 테스트만 사용.
          rm -f test/widget_test.dart

      - name: Strip uncommitted font refs from pubspec
        run: |
          python3 - <<'PY'
          from pathlib import Path
          # 번들 폰트 파일이 실제로 있으면 fonts: 선언을 유지한다.
          # (Pretendard 등 커밋된 폰트) 없을 때만 기본 폰트로 빌드하도록 스트립.
          if list(Path("assets/fonts").glob("*.otf")) or list(Path("assets/fonts").glob("*.ttf")):
              print("bundled font files present — keeping fonts: section")
              raise SystemExit(0)
          p = Path("pubspec.yaml")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          out, skip = [], False
          for ln in lines:
              if ln.startswith("  fonts:"):
                  skip = True
                  continue
              if skip and ln.strip() and not ln.startswith(("    ", "  fonts")):
                  skip = False
              if not skip:
                  out.append(ln)
          p.write_text("".join(out), encoding="utf-8")
          print("stripped fonts section")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Android (widget receiver, permissions, label, minSdk)
        run: python3 tool/ci_patch_android.py

      - name: Drift code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Run core tests
        run: flutter test

      # arm64 단일 APK 하나만 빌드 — 요즘 폰 전부 호환, 파일 1개(~10MB),
      # split-per-abi zip(28.7MB) 이 걸리던 첨부 용량제한도 회피.
      - name: Build release APK (arm64 only)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jigeum-arm64-apk
          path: jigeum/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # main 에 올라오면 롤링 최신 릴리즈로, 연동 브랜치면 프리뷰 릴리즈로 게시
      # → 폰에서 바로 설치 가능한 APK 링크가 생긴다.
      - name: Publish APK to Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/jigeum-google-calendar-sync-lqeo5b'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'jigeum-latest' || 'jigeum-gcal-preview' }}
          name: ${{ github.ref == 'refs/heads/main' && '지금 (Editorial) — 최신 APK' || '지금 — 구글 캘린더 연동 프리뷰 APK' }}
          body: |
            `지금` 앱 빌드 (arm64 release).
            구글 캘린더(폰 캘린더) 연동 + 1×1 빠른 추가 위젯 포함.
            커밋 ${{ github.sha }} 기준 자동 게시.

            설치: 아래 app-release.apk 를 폰에서 받아 실행 → "출처를 알 수 없는 앱" 허용 후 설치.
            연동: 앱 설정 → GOOGLE CALENDAR → 캘린더 연동 켜기 → 권한 허용.
          files: jigeum/build/app/outputs/flutter-apk/app-release.apk
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
