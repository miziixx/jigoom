name: Build Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/personal-dashboard-app-qpbbf8

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Build APK (personal debug)
        run: flutter build apk --flavor personal --debug --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-personal-debug
          path: build/app/outputs/flutter-apk/app-personal-debug.apk
          retention-days: 14
