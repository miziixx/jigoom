name: Build Dashboard APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/personal-dashboard-app-qpbbf8

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib/ --no-fatal-infos --no-fatal-warnings

      - name: Build APK (personal debug)
        run: flutter build apk --flavor personal --debug --android-skip-build-dependency-validation

      # 아티팩트 저장 용량 제한과 무관한 Release 에셋으로 업로드한다.
      - name: Publish APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dashboard-apk
          name: Dashboard APK (personal debug)
          body: |
            개인 대시보드 홈 화면 빌드 (personal flavor, debug).
            커밋: ${{ github.sha }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-personal-debug.apk
