name: Deploy salim to Pages

on:
  push:
    branches:
      - claude/repository-structure-decision-i47yd6
      - main
    paths:
      - "salim/**"
      - ".github/workflows/deploy-salim-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 충돌 방지 (진행 중인 실행은 취소)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: salim/package-lock.json

      - name: Install
        run: npm ci

      # GitHub Pages 프로젝트 사이트는 /myapps/ 하위 경로 → base를 맞춰 빌드
      - name: Build
        run: npm run build -- --base=/myapps/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: salim/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
