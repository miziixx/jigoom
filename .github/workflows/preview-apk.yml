name: Build Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/app-ui-ux-improvements-2ckax1

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --flavor personal --debug --android-skip-build-dependency-validation

      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-personal-debug.apk
          retention-days: 14

      - name: Publish APK to Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-ui-preview
          name: 지금 앱 프리뷰 APK
          body: |
            UI 개선 5종 적용 프리뷰 빌드 (debug).
            커밋 ${{ github.sha }} 기준 자동 게시.
          files: build/app/outputs/flutter-apk/app-personal-debug.apk
          prerelease: true
