  if(el.hasAttribute("data-setbucket")){ var q=el.getAttribute("data-setbucket").split("|"); setField(q[0],"bucket",q[1]); render(); return; }
  if(el.hasAttribute("data-dquick")){ var dq=el.getAttribute("data-dquick").split("|"); setField(dq[0],"date",dq[1]); render(); return; }
  if(el.hasAttribute("data-dclear")){ setField(el.getAttribute("data-dclear"),"date",null); render(); return; }
  if(el.hasAttribute("data-tclear")){ var tc=el.getAttribute("data-tclear"); setField(tc,"time",null); setField(tc,"end",null); render(); return; }
  if(el.hasAttribute("data-tltoggle")){ toggleTL(); return; }
  if(el.hasAttribute("data-tlmode")){ setTLMode(el.getAttribute("data-tlmode")); return; }
  if(el.hasAttribute("data-tlbucket")){ var tb=el.getAttribute("data-tlbucket").split("|"); moveToBucket(tb[0],tb[1]); return; }
  if(el.id==="rescheduleBtn"){ rescheduleOverdue(); return; }
  if(el.hasAttribute("data-view")){ state.view=el.getAttribute("data-view"); render(); return; }
  if(el.hasAttribute("data-screen")){ clearSearch(); state.screen=el.getAttribute("data-screen"); state.editingId=null; state.moreMenu=false; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(el.id==="cleanupBtn"){ startCleanup(); return; }
  if(el.id==="backdrop"){ if(state.settings) closeSettings(); else if(state.moreMenu) closeMore(); else if(state.tmpl) closeTemplates(); else closeSheet(); return; }
  if(el.id==="sheet"){ e.stopPropagation(); return; }
  if(el.id==="sheetSkip"){ closeSheet(); return; }
  if(el.hasAttribute("data-when")){ answerWhen(el.getAttribute("data-when")); return; }
  if(el.hasAttribute("data-acat")){ answerCat(el.getAttribute("data-acat")); return; }
  if(el.id==="sideAddBtn"){ var si=document.getElementById("sideInput"); addTask(si.value); si.value=""; si.focus(); return; }
  if(el.id==="mAddBtn"){ var mi=document.getElementById("mInput"); addTask(mi.value); mi.value=""; mi.focus(); return; }
  if(el.id==="topAddBtn"){ var ti=document.getElementById("topInput"); addTask(ti.value); ti.value=""; ti.focus(); return; }
  if(el.id==="dayAddBtn"){ var di=document.getElementById("dayInput"); if(di){ addTask(di.value,{date:state.calSel,bucket:(state.calSel===TODAY?"오늘":"이번주")}); } return; }
  if(el.id==="fab"){ var inp=window.matchMedia("(max-width:859px)").matches?document.getElementById("mInput"):document.getElementById("sideInput"); inp.scrollIntoView({behavior:"smooth",block:"center"}); inp.focus(); return; }
  if(el.id==="mHide"||el.id==="sideHide"){ state.hideDone=!state.hideDone; render(); return; }
  if(el.hasAttribute("data-calprev")){ state.calM--; if(state.calM<0){state.calM=11;state.calY--;} render(); return; }
  if(el.hasAttribute("data-calnext")){ state.calM++; if(state.calM>11){state.calM=0;state.calY++;} render(); return; }
  if(el.hasAttribute("data-caltoday")){ var nt=new Date(); state.calY=nt.getFullYear(); state.calM=nt.getMonth(); state.calSel=TODAY; render(); return; }
  if(el.hasAttribute("data-calday")){ state.calSel=el.getAttribute("data-calday"); render(); return; }
});

/* ══ 키보드 ══ */
document.addEventListener("keydown",function(e){
  if(e.key!=="Enter") return;
  if(e.target.id==="sideInput"){ addTask(e.target.value); e.target.value=""; }
  if(e.target.id==="mInput")   { addTask(e.target.value); e.target.value=""; }
  if(e.target.id==="topInput") { addTask(e.target.value); e.target.value=""; }
  if(e.target.id==="dayInput") { addTask(e.target.value,{date:state.calSel,bucket:(state.calSel===TODAY?"오늘":"이번주")}); e.target.value=""; }
  if(e.target.id==="projInput") { addProject(e.target.value); }
  if(e.target.id==="rtInput")   { addRoutine(e.target.value); }
  if(e.target.id==="memoInput") { addMemo(e.target.value); e.target.value=""; }
  if(e.target.id==="projDetailInput"){ if(state.projOpen) addTaskToProject(state.projOpen,e.target.value); }
});
document.addEventListener("input",function(e){
  if(e.target.id==="searchInput"){ state.search=e.target.value; render(); }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-memoedit")){ autoSizeMemoTa(e.target); }
});
document.addEventListener("change",function(e){
  if(e.target.id==="dataImport"){ importData(e.target.files&&e.target.files[0]); e.target.value=""; return; }
  if(e.target.id==="npStart"){ npSyncInputs(); npSetStart(e.target.value); return; }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-npstepdate")){ npSyncInputs(); npSetStepDate(+e.target.getAttribute("data-npstepdate"), e.target.value); return; }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-setdate")){
    setField(e.target.getAttribute("data-setdate"),"date",e.target.value||null); render();
  }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-settime")){
    var sid=e.target.getAttribute("data-settime"); setField(sid,"time",e.target.value||null);
    if(e.target.value){ var st=state.tasks.filter(function(t){return t.id===sid;})[0]; if(st&&!st.date) setField(sid,"date",TODAY); }
    render();
  }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-setend")){
    setField(e.target.getAttribute("data-setend"),"end",e.target.value||null); render();
  }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-catname")){
    renameCat(+e.target.getAttribute("data-catname"), e.target.value);
  }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-projname")){ renameProject(e.target.getAttribute("data-projname"), e.target.value); }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-projmemo")){ setProjectField(e.target.getAttribute("data-projmemo"),"memo",e.target.value); }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-projdue")){ setProjectField(e.target.getAttribute("data-projdue"),"due",e.target.value||""); render(); }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-rtname")){ renameRoutine(e.target.getAttribute("data-rtname"), e.target.value); }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-rtnote")){ setRoutineNote(e.target.getAttribute("data-rtnote"), e.target.value); }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-memoedit")){ updateMemo(e.target.getAttribute("data-memoedit"), e.target.value); }
  if(e.target.id==="diaryText"){ setDiary(state.diaryDate||TODAY, e.target.value); }
  if(e.target.hasAttribute&&e.target.hasAttribute("data-diarydate")){ state.diaryDate=e.target.value||TODAY; render(); }
});
document.addEventListener("focusout",function(e){
  if(e.target.hasAttribute&&e.target.hasAttribute("data-memoedit")){ e.target.setAttribute("readonly",""); }
});

/* ══ 드래그 ══ */
var drag={id:null,drop:null};
document.addEventListener("pointerdown",function(e){
  var grip=e.target.closest("[data-grip]"); if(!grip) return;
  e.preventDefault();
  var id=grip.getAttribute("data-grip");
  var task=state.tasks.filter(function(t){return t.id===id;})[0]; if(!task) return;
  try{grip.setPointerCapture(e.pointerId);}catch(_){}
  drag.id=id; drag.drop=null; state.editingId=null;
  document.getElementById("ghostSlot").innerHTML='<div class="ghost" id="ghost">'+esc(task.text)+"</div>";
  var ghost=document.getElementById("ghost");
  var card=document.querySelector('[data-card="'+id+'"]'); if(card) card.classList.add("dragging");
  pos(ghost,e.clientX,e.clientY);
  function move(ev){
    pos(ghost,ev.clientX,ev.clientY);
    document.querySelectorAll(".group.over,.proj-col.over,.tl-hour.over,.tl-panel.over,.cal-day.over").forEach(function(g){g.classList.remove("over");});
    var under=document.elementFromPoint(ev.clientX,ev.clientY); if(!under){drag.drop=null;return;}
    // 달력 날짜 칸 위에 올렸을 때 → 그 날로 일정 이동
    var calCell=under.closest("[data-calday]");
    if(calCell){ calCell.classList.add("over"); drag.drop={cal:calCell.getAttribute("data-calday")}; return; }
    // 타임라인 위에 올렸을 때
    var tlPanel=under.closest("[data-tldrop]");
    if(tlPanel){
      var tlHour=under.closest("[data-tlhour]");
      if(tlHour){ tlHour.classList.add("over"); drag.drop={tl:true,hour:+tlHour.getAttribute("data-tlhour")}; }
      else{ tlPanel.classList.add("over"); drag.drop={tl:true,hour:null}; }
      return;
    }
    var groupEl=under.closest("[data-group]"); var cardEl=under.closest("[data-card]");
    if(!groupEl){drag.drop=null;return;}
    groupEl.classList.add("over");
    var group=groupEl.getAttribute("data-group"),beforeId=null;
    if(cardEl&&cardEl.getAttribute("data-card")!==id){
      var r=cardEl.getBoundingClientRect(),after=ev.clientY>r.top+r.height/2;
      beforeId=after?(cardEl.getAttribute("data-next")||null):cardEl.getAttribute("data-card");
    }
    drag.drop={group:group,beforeId:beforeId};
  }
  function up(){
    var d=drag.drop;
    if(d&&d.cal){
      // 달력에서 다른 날로 끌어 옮김 → date 변경 + 버킷 자동 재계산
      var mvc=state.tasks.filter(function(t){return t.id===id;})[0];
      if(mvc){
        state.tasks=state.tasks.map(function(t){return t.id===id?Object.assign({},t,{date:d.cal,bucket:bucketForDate(d.cal)}):t;});
        state.calSel=d.cal; save();
      }
    }else if(d&&d.tl){
      var mv=state.tasks.filter(function(t){return t.id===id;})[0];
      if(mv){
        var upd={date:TODAY,bucket:"오늘"};
        if(d.hour!==null) upd.time=(d.hour<10?"0":"")+d.hour+":00";
        state.tasks=state.tasks.map(function(t){return t.id===id?Object.assign({},t,upd):t;});
        save();
      }
    }else if(d){
      var field=state.view==="bucket"?"bucket":"cat";
      if(state.screen==="projects") field="proj";
      else if(state.screen!=="tasks") field="bucket";
      var gval=(field==="proj"&&d.group===PROJ_NONE)?null:d.group;
      var moving=state.tasks.filter(function(t){return t.id===id;})[0];
      if(moving){
        var updated=Object.assign({},moving,{[field]:gval});
        var rest=state.tasks.filter(function(t){return t.id!==id;});
        if(!d.beforeId) state.tasks=rest.concat([updated]);
        else{ var idx=rest.findIndex(function(t){return t.id===d.beforeId;}); state.tasks=idx<0?rest.concat([updated]):rest.slice(0,idx).concat([updated],rest.slice(idx)); }
        save();
      }
    }
    drag.id=null; drag.drop=null;
    document.getElementById("ghostSlot").innerHTML="";
    window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up);
    render();
  }
  window.addEventListener("pointermove",move); window.addEventListener("pointerup",up);
});
function pos(g,x,y){ if(g){g.style.left=x+"px";g.style.top=y+"px";} }

document.addEventListener("visibilitychange",function(){
  if(!document.hidden && currentUser && sb){ drainInboxQueue().then(function(ok){ if(ok) render(); }); }
});
init();
