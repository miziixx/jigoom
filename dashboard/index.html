<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="theme-color" content="#F6FAF8">
<meta name="description" content="할 일·일정·받은함을 한눈에">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="대시보드">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>내 운영 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#F6FAF8;--surface:#fff;--sidebar:#ECF4F0;--border:#DCE8E2;
  --text:#3A3F3C;--mid:#6E7873;--dim:#9AA6A0;--faint:#BCC6C0;
  --accent:#4FB99F;--accent-l:#E1F4EF;--accent-soft:#EFF9F6;
  --accent-rgb:79,185,159;--avatar:#D6F0E7;--over:#EAF8F2;
}
html,body{background:var(--bg);}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
button,input{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

/* ── 인증 오버레이 ── */
.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;}
.auth-card{background:#fff;border:1.5px solid #EFE8DC;border-radius:24px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(120,90,50,.08);}
.auth-top{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:22px;}
.auth-avatar{width:60px;height:60px;border-radius:18px;background:var(--avatar);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(var(--accent-rgb),.22);}
.auth-title{font-size:20px;font-weight:900;}
.auth-mode{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;}
.auth-err{font-size:12.5px;font-weight:700;border-radius:10px;padding:9px 12px;margin-bottom:12px;display:none;}
.auth-err.on{display:block;color:#E04560;background:#FFF1F2;border:1px solid #FCC8CE;}
.auth-err.info{display:block;color:var(--mid);background:var(--accent-soft);border:1px solid rgba(var(--accent-rgb),.35);}
.auth-label{font-size:11px;font-weight:800;color:var(--mid);letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:5px;}
.auth-input{width:100%;border:1.5px solid var(--border);background:var(--bg);border-radius:12px;padding:11px 14px;font-size:15px;outline:none;color:var(--text);margin-bottom:12px;font-family:inherit;}
.auth-input:focus{border-color:var(--accent);}
.auth-btn{width:100%;border:none;background:var(--accent);color:#fff;font-weight:800;border-radius:13px;padding:13px;font-size:15px;cursor:pointer;margin-top:4px;font-family:inherit;transition:opacity .1s;}
.auth-btn:disabled{opacity:.6;cursor:default;}
.auth-btn:not(:disabled):active{transform:scale(.98);}
.auth-switch{width:100%;border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:700;padding:14px 0 0;cursor:pointer;font-family:inherit;}

/* ── 사용자 박스 (사이드바 하단) ── */
.user-box{display:flex;flex-direction:column;gap:6px;}
.user-email{font-size:11px;color:var(--dim);font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;}
.logout-btn{border:1.5px solid var(--border);background:#fff;color:var(--dim);font-size:12px;font-weight:700;padding:9px;border-radius:11px;cursor:pointer;width:100%;font-family:inherit;}
.logout-btn:hover{color:#E04560;border-color:#FCC8CE;}
.local-hint{font-size:11px;color:var(--faint);font-weight:600;text-align:center;padding:4px 0;}
.sync-status{font-size:11px;font-weight:700;text-align:center;padding:5px 8px;border-radius:9px;display:none;}
.sync-status.on{color:var(--mid);background:var(--accent-soft);}
.sync-status.err{color:#C77B22;background:#FFF6E9;border:1px solid #F5D9A8;}
.sync-status.off{color:var(--dim);background:var(--bg);}

/* ── 메모 ── */
.memo-list{display:flex;flex-direction:column;gap:10px;}
.memo-card{background:#fff;border:1.5px solid #EFE8DC;border-radius:14px;padding:12px 13px;box-shadow:0 1px 4px rgba(120,90,50,.05);}
.memo-ta{width:100%;border:none;background:transparent;outline:none;resize:none;font-family:inherit;font-size:14.5px;line-height:1.55;color:var(--text);min-height:42px;overflow:hidden;}
.memo-ta[readonly]{cursor:default;-webkit-user-select:text;user-select:text;}
.memo-ta::placeholder{color:var(--faint);}
.memo-foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
.memo-time{font-size:11px;color:var(--faint);font-weight:600;}
.memo-edit-btn{background:none;border:none;cursor:pointer;padding:0 3px;color:var(--dim);display:inline-flex;align-items:center;}
.memo-edit-btn .nav-ic{width:15px;height:15px;}
.memo-edit-btn .nav-ic svg{width:14px;height:14px;}

/* ── 일기 ── */
.diary-nav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.diary-arrow{width:36px;height:36px;border:1.5px solid var(--border);background:#fff;color:var(--mid);border-radius:11px;font-size:18px;font-weight:800;cursor:pointer;line-height:1;}
.diary-arrow:hover{border-color:rgba(var(--accent-rgb),.4);}
.diary-date{border:1.5px solid var(--border);background:#fff;border-radius:11px;padding:8px 12px;font-size:14px;font-family:inherit;color:var(--text);outline:none;}
.diary-date:focus{border-color:var(--accent);}
.diary-day{font-size:14px;font-weight:800;color:var(--mid);margin-bottom:8px;}
.diary-ta{width:100%;min-height:240px;border:1.5px solid #EFE8DC;background:#fff;border-radius:16px;padding:16px;font-family:inherit;font-size:15px;line-height:1.7;color:var(--text);outline:none;resize:vertical;box-shadow:0 1px 4px rgba(120,90,50,.05);}
.diary-ta:focus{border-color:var(--accent);}
.diary-ta::placeholder{color:var(--faint);}
.diary-recent{display:flex;flex-direction:column;gap:7px;}
.diary-item{display:flex;flex-direction:column;gap:3px;text-align:left;background:#fff;border:1.5px solid #EFE8DC;border-radius:12px;padding:10px 13px;cursor:pointer;width:100%;font-family:inherit;}
.diary-item:hover{border-color:rgba(var(--accent-rgb),.4);}
.diary-item-d{font-size:12px;font-weight:800;color:var(--accent);}
.diary-item-p{font-size:13px;color:var(--mid);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── 셸 ── */
.shell{display:flex;min-height:100vh;max-width:1760px;margin:0 auto;}

/* ── 사이드바 ── */
.side{width:264px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{display:flex;align-items:center;gap:11px;}
.avatar{width:46px;height:46px;border-radius:15px;background:var(--avatar);flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(var(--accent-rgb),.22);}
.brand-t{font-size:16px;font-weight:900;line-height:1.25;}
.side-add{display:flex;flex-direction:column;gap:8px;}
.add-input{border:1.5px solid var(--border);background:#fff;border-radius:13px;padding:12px 14px;font-size:15px;outline:none;color:var(--text);width:100%;}
.add-input:focus{border-color:var(--accent);}
.add-input::placeholder{color:var(--faint);}
.add-btn{border:none;background:var(--accent);color:#fff;font-weight:800;border-radius:13px;padding:11px;font-size:14px;cursor:pointer;}
.add-btn:active{transform:scale(.98);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{display:flex;align-items:center;gap:5px;border:1.5px solid var(--border);background:#fff;color:var(--dim);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;}
.cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block;}
.side-sep{height:1px;background:var(--border);}
.side-label{font-size:10px;font-weight:800;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
.side-nav{display:flex;flex-direction:column;gap:4px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;border:none;background:transparent;color:var(--mid);font-size:13.5px;font-weight:700;cursor:pointer;text-align:left;width:100%;}
.nav-item:hover{background:rgba(var(--accent-rgb),.1);}
.nav-item.on{background:var(--accent-l);color:var(--accent);}
.nav-emoji{font-size:16px;width:20px;text-align:center;}
.nav-badge{margin-left:auto;font-size:10px;font-weight:800;background:#F43F5E;color:#fff;border-radius:99px;padding:1px 7px;}
.side-sub{display:flex;flex-direction:column;gap:4px;padding-left:4px;}
.side-spacer{flex:1;}
.side-toggle{border:1.5px solid var(--border);background:#fff;color:var(--dim);font-size:12px;font-weight:700;padding:9px;border-radius:11px;cursor:pointer;}
.side-toggle.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.4);background:var(--accent-soft);}

/* ── 메인 ── */
.main{flex:1;min-width:0;padding:22px 22px 90px;}
.mhead{display:none;}
.section-title{font-size:13px;font-weight:800;color:var(--mid);margin-bottom:11px;display:flex;align-items:center;gap:6px;}
.screen-title{font-size:18px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:7px;}
.top3{background:#fff;border:1.5px solid #EFE8DC;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(120,90,50,.05);}
.p-item{display:flex;align-items:center;gap:11px;background:var(--bg);border:1.5px solid #EFE8DC;border-radius:12px;padding:11px 13px;margin-bottom:7px;}
.p-item:last-child{margin-bottom:0;}
.p-num{font-size:13px;font-weight:800;color:var(--dim);width:14px;text-align:center;flex-shrink:0;}
.p-text{flex:1;font-size:14px;font-weight:600;}
.empty{font-size:12.5px;color:var(--faint);font-weight:600;padding:6px 2px;}
.cleanup{width:100%;display:flex;align-items:center;justify-content:space-between;background:#FFF1F2;border:1.5px solid #FCC8CE;border-radius:13px;padding:12px 15px;margin-bottom:14px;cursor:pointer;}
.cleanup-l{font-size:13px;font-weight:700;color:#E04560;}
.cleanup-r{font-size:12px;font-weight:800;color:#E04560;white-space:nowrap;}
.controls{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.seg{display:inline-flex;background:#EFE8DC;border-radius:11px;padding:3px;}
.seg button{border:none;background:transparent;color:var(--dim);font-weight:700;font-size:13px;padding:8px 15px;border-radius:8px;cursor:pointer;}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.toggle{border:1.5px solid var(--border);background:#fff;color:var(--dim);font-size:12px;font-weight:700;padding:8px 13px;border-radius:10px;cursor:pointer;}
.toggle.on{color:var(--accent);border-color:rgba(var(--accent-rgb),.4);background:var(--accent-soft);}
.controls-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
/* ── 3단 레이아웃 ── */
.tasks-layout{display:grid;grid-template-columns:1fr;gap:20px;align-items:start;}
.tasks-layout.with-tl{grid-template-columns:minmax(0,1fr) 360px;}
.tasks-layout.with-tl .board{grid-template-columns:1fr;}
@media(min-width:1500px){.tasks-layout.with-tl .board{grid-template-columns:1fr 1fr;}.tasks-layout.with-tl{grid-template-columns:minmax(0,1fr) 400px;}}
.timeline-col{position:sticky;top:18px;}
/* ── 밀린 일정 배너 ── */
.overdue{width:100%;display:flex;align-items:center;justify-content:space-between;background:#FFF6E9;border:1.5px solid #F5D9A8;border-radius:13px;padding:12px 15px;margin-bottom:14px;cursor:pointer;}
.overdue-l{font-size:13px;font-weight:700;color:#C77B22;}
.overdue-r{font-size:12px;font-weight:800;color:#C77B22;white-space:nowrap;}
.c-over{font-size:10px;font-weight:800;color:#C77B22;background:#FFF1DC;padding:3px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
.card.is-over{border-color:#F5D9A8;}
.c-time{font-size:10px;font-weight:700;color:var(--mid);background:var(--sidebar);padding:3px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
.ed-tilde{color:var(--dim);font-weight:800;font-size:12px;}
/* ── 타임라인 패널 ── */
.tl-panel{background:#fff;border:1.5px solid #EFE8DC;border-radius:18px;padding:14px;box-shadow:0 1px 4px rgba(120,90,50,.05);}
.tl-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.tl-title{font-size:14px;font-weight:900;}
.tl-seg button{padding:6px 12px;font-size:12px;}
.tl-empty{font-size:12.5px;color:var(--faint);font-weight:600;text-align:center;line-height:1.7;padding:24px 6px;}
.tl-clock{display:flex;flex-direction:column;}
.tl-hour{display:flex;gap:9px;min-height:38px;border-top:1px solid #F3EFE8;padding-top:7px;border-radius:8px;transition:background .1s;}
.tl-hour:first-child{border-top:none;}
.tl-hour.over{background:var(--over);box-shadow:inset 0 0 0 1.5px var(--accent);}
.tl-panel.over{box-shadow:0 0 0 2px var(--accent);}
.tl-hint{font-size:11.5px;color:var(--accent);font-weight:700;background:var(--accent-soft);border-radius:10px;padding:9px 11px;margin-bottom:10px;line-height:1.5;}
.tl-time{font-size:11px;font-weight:800;color:var(--dim);width:38px;flex-shrink:0;padding-top:3px;}
.tl-slot{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.tl-block{display:flex;align-items:center;gap:7px;background:var(--bg);border-left:3px solid var(--accent);border-radius:8px;padding:7px 9px;}
.tl-block.done{opacity:.55;}
.tl-btext{flex:1;font-size:12.5px;font-weight:600;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tl-bt{font-size:10px;font-weight:700;color:var(--dim);flex-shrink:0;white-space:nowrap;}
.tl-bt-no{color:var(--faint);}
.tl-pool{margin-top:12px;border-top:1px dashed #E0D8CC;padding-top:10px;}
.tl-pool-h{font-size:11px;font-weight:800;color:var(--dim);margin-bottom:7px;}
.tl-agenda{display:flex;flex-direction:column;gap:6px;}
.tl-item{display:flex;align-items:center;gap:8px;background:var(--bg);border:1.5px solid #EFE8DC;border-radius:10px;padding:8px 10px;}
.tl-item.done{opacity:.55;}
.tl-item .round{width:20px;height:20px;}
.tl-itext{flex:1;font-size:13px;font-weight:600;min-width:0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.board{display:grid;gap:14px;grid-template-columns:1fr 1fr;}
.group{background:#fff;border:1.5px solid #EFE8DC;border-radius:18px;padding:14px;box-shadow:0 1px 4px rgba(120,90,50,.04);transition:border-color .12s,background .12s;}
.group.over{border-color:var(--accent);background:var(--over);}
.g-head{display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap;}
.g-name{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;}
.g-count{font-size:11px;font-weight:800;color:var(--dim);background:#F3EFE8;border-radius:99px;padding:1px 8px;}
.g-hint{font-size:11px;color:var(--faint);font-weight:600;margin-left:auto;}
.drop-empty{border:1.5px dashed #E0D8CC;border-radius:11px;text-align:center;color:var(--faint);font-size:12px;font-weight:600;padding:16px;}
.card{background:#fff;border:1.5px solid #EFE8DC;border-radius:13px;margin-bottom:7px;overflow:hidden;}
.card:last-child{margin-bottom:0;}
.card.dragging{opacity:.35;}
.card.is-done{background:#FAF9F6;}
.card-main{display:flex;align-items:center;gap:9px;padding:11px 12px;}
.grip{font-size:17px;color:var(--faint);cursor:grab;flex-shrink:0;touch-action:none;padding:2px;line-height:1;}
.grip:active{cursor:grabbing;}
.round{width:23px;height:23px;border-radius:50%;flex-shrink:0;border:2px solid #E0D8CC;background:#fff;cursor:pointer;font-size:12px;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;}
.round.done{background:var(--accent);border-color:var(--accent);}
.c-text{flex:1;font-size:14px;font-weight:600;cursor:pointer;min-width:0;word-break:break-word;overflow-wrap:break-word;}
.strike{text-decoration:line-through;color:var(--faint);}
.c-date{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
.decide{border:none;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:5px 11px;border-radius:99px;cursor:pointer;flex-shrink:0;}
.c-tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;flex-shrink:0;white-space:nowrap;}
.x{border:none;background:transparent;color:var(--faint);font-size:19px;cursor:pointer;flex-shrink:0;padding:0 2px;line-height:1;}
.x:hover{color:#F43F5E;}
.editor{border-top:1px solid #F3EFE8;padding:11px 12px;background:#FCFBF8;}
.ed-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.ed-row:last-child{margin-bottom:0;}
.ed-label{font-size:11px;font-weight:800;color:var(--dim);width:30px;flex-shrink:0;}
.mini{border:1.5px solid var(--border);background:#fff;color:var(--mid);font-size:12px;font-weight:700;padding:6px 11px;border-radius:9px;cursor:pointer;}
.mini.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.ed-date{border:1.5px solid var(--border);background:#fff;color:var(--mid);font-size:12px;font-weight:700;padding:5px 8px;border-radius:9px;}
.foot{font-size:12px;color:var(--dim);font-weight:600;text-align:center;margin-top:22px;line-height:1.6;}
.cal{background:#fff;border:1.5px solid #EFE8DC;border-radius:18px;padding:16px;box-shadow:0 1px 4px rgba(120,90,50,.05);max-width:620px;}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.cal-title{font-size:16px;font-weight:900;}
.cal-nav{border:1.5px solid var(--border);background:#fff;color:var(--mid);width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:15px;font-weight:800;}
.cal-today{margin-left:auto;border:1.5px solid var(--border);background:#fff;color:var(--accent);font-size:12px;font-weight:800;padding:7px 12px;border-radius:10px;cursor:pointer;}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.cal-wd span{text-align:center;font-size:11px;font-weight:800;color:var(--dim);padding:4px 0;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-day{aspect-ratio:1/1;border:1.5px solid transparent;border-radius:12px;background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 2px;gap:3px;}
.cal-day.blank{background:transparent;cursor:default;}
.cal-day .dnum{font-size:13px;font-weight:700;color:var(--text);}
.cal-day.today{border-color:var(--accent);}
.cal-day.sel{background:var(--accent);}
.cal-day.sel .dnum{color:#fff;}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
.cal-flags{display:flex;gap:2px;justify-content:center;margin-bottom:1px;}
.cal-flag{width:9px;height:4px;border-radius:2px;}
.cal-day.sel .cal-flag{box-shadow:0 0 0 1px rgba(255,255,255,.7);}
.cal-dots .cdot{width:5px;height:5px;}
.cal-day.sel .cdot{box-shadow:0 0 0 1px rgba(255,255,255,.7);}
.cal-sun .dnum{color:#E07A8B;}
.cal-day.sel.cal-sun .dnum{color:#fff;}
.daylist{margin-top:16px;}
.daylist-h{font-size:14px;font-weight:900;margin-bottom:10px;}
.dayadd{display:flex;gap:7px;margin-top:10px;}
.dayadd .add-input{flex:1;padding:10px 12px;font-size:14px;}
.dayadd .add-btn{padding:0 16px;flex-shrink:0;}
.fab{position:fixed;right:18px;bottom:84px;width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:30px;font-weight:300;line-height:1;cursor:pointer;z-index:500;box-shadow:0 8px 24px rgba(var(--accent-rgb),.5);display:flex;align-items:center;justify-content:center;}
.fab:active{transform:scale(.94);}
.tabbar{display:none;}
.ghost{position:fixed;transform:translate(-20px,-50%);pointer-events:none;z-index:999;background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:9px 13px;border-radius:10px;box-shadow:0 8px 24px rgba(var(--accent-rgb),.45);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.backdrop{position:fixed;inset:0;background:rgba(61,53,48,.4);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
.sheet{width:100%;max-width:460px;background:#fff;border-radius:26px 26px 0 0;padding:14px 22px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:rise .22s ease;max-height:90vh;overflow-y:auto;}
@keyframes rise{from{transform:translateY(40px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none;}}
.sheet-grip{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px;}
.sheet-task{font-size:15px;font-weight:800;margin-bottom:10px;}
.sheet-step{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;}
.sheet-remain{color:var(--faint);}
.sheet-q{font-size:19px;font-weight:900;margin-bottom:16px;}
.sheet-opt{width:100%;text-align:left;border:none;background:var(--accent-soft);border-radius:14px;padding:13px 15px;margin-bottom:9px;cursor:pointer;}
.sheet-opt:active{transform:scale(.99);}
.opt-title{font-size:15px;font-weight:800;}
.opt-sub{font-size:12px;color:var(--dim);margin-top:3px;font-weight:600;}
.sheet-cats{display:flex;flex-wrap:wrap;gap:9px;}
.sheet-cat{flex:1 1 44%;display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:800;cursor:pointer;}
.sheet-cat:active{transform:scale(.98);}
.sheet-skip{width:100%;border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:700;padding:14px 0 4px;cursor:pointer;}
.chip-mgr{color:var(--accent);border-color:rgba(var(--accent-rgb),.4);background:var(--accent-soft);}
.cm-list{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
.cm-row{display:flex;align-items:center;gap:9px;}
.cm-dot{width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--border);cursor:pointer;flex-shrink:0;padding:0;}
.cm-name{flex:1;min-width:0;border:1.5px solid var(--border);background:var(--bg);border-radius:11px;padding:10px 12px;font-size:15px;font-weight:700;color:var(--text);outline:none;font-family:inherit;}
.cm-name:focus{border-color:var(--accent);}
.cm-del{border:1.5px solid var(--border);background:#fff;color:var(--dim);font-size:12px;font-weight:700;padding:9px 13px;border-radius:10px;cursor:pointer;flex-shrink:0;font-family:inherit;}
.cm-del:hover{color:#E04560;border-color:#FCC8CE;}
.cm-palette{display:flex;gap:9px;flex-wrap:wrap;padding:2px 0 4px 37px;}
.cm-sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--border);cursor:pointer;padding:0;}
.cm-sw.on{box-shadow:0 0 0 2.5px var(--accent);}
.cm-add{width:100%;border:1.5px dashed rgba(var(--accent-rgb),.45);background:var(--accent-soft);color:var(--accent);font-size:14px;font-weight:800;padding:13px;border-radius:13px;cursor:pointer;font-family:inherit;}
.cm-hint{font-size:11.5px;color:var(--faint);font-weight:600;text-align:center;padding:10px 0 2px;}
.th-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.th-card{display:flex;align-items:center;gap:10px;border:2px solid transparent;background:var(--bg);border-radius:14px;padding:10px;cursor:pointer;font-family:inherit;text-align:left;}
.th-card.on{box-shadow:0 0 0 1px rgba(var(--accent-rgb),.25);}
.th-swatch{display:flex;align-items:center;gap:4px;width:54px;height:40px;border-radius:10px;justify-content:center;flex-shrink:0;box-shadow:inset 0 0 0 1px var(--border);}
.th-dot{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.04);}
.th-name{font-size:14px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:5px;}
.th-check{color:var(--accent);font-size:13px;font-weight:900;}
/* ── 노션식 라인 아이콘 ── */
.nav-ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.nav-ic svg{width:18px;height:18px;display:block;}
.nav-ic svg *{stroke:currentColor;}
.tab-ic{display:flex;align-items:center;justify-content:center;height:22px;}
.tab-ic svg{width:22px;height:22px;display:block;color:var(--mid);}
.tab-ic svg *{stroke:currentColor;}
.tab-item.on .tab-ic svg{color:var(--accent);}
.manage-btn{display:flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--border);background:#fff;color:var(--mid);font-size:12px;font-weight:700;padding:9px;border-radius:11px;cursor:pointer;width:100%;font-family:inherit;}
.manage-btn:hover{color:var(--accent);border-color:rgba(var(--accent-rgb),.4);}
.manage-btn .nav-ic{width:16px;height:16px;}
.manage-btn .nav-ic svg{width:15px;height:15px;}
/* ── 관리 통합 시트 구획 ── */
.set-sec{margin-bottom:20px;}
.set-sec-h{font-size:12px;font-weight:800;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:11px;display:flex;align-items:center;gap:6px;}
.set-sep{height:1px;background:var(--border);margin:4px 0 18px;}
.acct-email{font-size:14px;font-weight:700;color:var(--text);background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acct-logout{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:1.5px solid #FCC8CE;background:#FFF1F2;color:#E04560;font-size:14px;font-weight:800;padding:13px;border-radius:13px;cursor:pointer;font-family:inherit;}
.acct-logout:active{transform:scale(.99);}
.acct-logout .nav-ic{width:17px;height:17px;}
/* ── 요약 화면 ── */
.sum-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:16px;}
.sum-card{background:#fff;border:1.5px solid #EFE8DC;border-radius:16px;padding:15px 16px;box-shadow:0 1px 4px rgba(120,90,50,.05);}
.sum-num{font-size:26px;font-weight:900;color:var(--text);line-height:1.1;}
.sum-lbl{font-size:12px;font-weight:700;color:var(--mid);margin-top:4px;}
.sum-num.accent{color:var(--accent);}
.sum-num.warn{color:#C77B22;}
.sum-block{background:#fff;border:1.5px solid #EFE8DC;border-radius:16px;padding:15px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(120,90,50,.05);}
.sum-block-h{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
/* ── 통계 화면 ── */
.stat-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.stat-bar-name{width:84px;flex-shrink:0;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.stat-bar-track{flex:1;height:14px;background:var(--bg);border-radius:99px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:99px;}
.stat-bar-val{font-size:11px;font-weight:800;color:var(--dim);width:40px;text-align:right;flex-shrink:0;}
.ring-wrap{display:flex;align-items:center;gap:18px;}
.ring{flex-shrink:0;}
.ring-c{font-size:13px;font-weight:700;color:var(--mid);line-height:1.7;}
.ring-c b{color:var(--text);font-weight:900;}
/* ── 프로젝트 화면 ── */
.proj-board{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));align-items:start;}
.proj-col{background:#fff;border:1.5px solid #EFE8DC;border-radius:18px;padding:14px;box-shadow:0 1px 4px rgba(120,90,50,.04);transition:border-color .12s,background .12s;}
.proj-col.over{border-color:var(--accent);background:var(--over);}
.proj-head{display:flex;align-items:center;gap:8px;margin-bottom:11px;}
.proj-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.proj-name{font-size:14px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.proj-prog{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:11px;}
.proj-prog-fill{height:100%;border-radius:99px;}
.proj-add-col{display:flex;gap:7px;margin-bottom:14px;}
.proj-add-col .add-input{flex:1;}
.proj-add-col .add-btn{padding:0 16px;flex-shrink:0;}
.proj-mini-add{width:100%;border:1.5px dashed #E0D8CC;background:transparent;color:var(--faint);font-size:12px;font-weight:700;padding:9px;border-radius:11px;cursor:pointer;margin-top:7px;font-family:inherit;}
.proj-mini-add:hover{color:var(--accent);border-color:rgba(var(--accent-rgb),.4);}
.tmpl-open{width:100%;border:1.5px dashed rgba(var(--accent-rgb),.45);background:var(--accent-soft);color:var(--accent);font-size:13.5px;font-weight:800;padding:12px;border-radius:13px;cursor:pointer;margin-bottom:16px;font-family:inherit;}
.tmpl-open:active{transform:scale(.99);}
/* ── 루틴 화면 ── */
.rt-list{display:flex;flex-direction:column;gap:9px;margin-bottom:16px;}
.rt-row{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid #EFE8DC;border-radius:14px;padding:13px 14px;box-shadow:0 1px 4px rgba(120,90,50,.04);}
.rt-check{width:26px;height:26px;border-radius:9px;flex-shrink:0;border:2px solid #E0D8CC;background:#fff;cursor:pointer;font-size:14px;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;}
.rt-check.done{background:var(--accent);border-color:var(--accent);}
.rt-body{flex:1;min-width:0;}
.rt-name{font-size:14px;font-weight:700;}
.rt-name.done{color:var(--faint);}
.rt-meta{font-size:11px;font-weight:600;color:var(--dim);margin-top:3px;display:flex;gap:8px;}
.rt-streak{color:var(--accent);font-weight:800;}
.rt-seq{font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:99px;}
.rt-dots{display:flex;gap:3px;margin-top:5px;}
.rt-d{width:13px;height:13px;border-radius:4px;background:var(--bg);border:1px solid var(--border);}
.rt-d.on{background:var(--accent);border-color:var(--accent);}
.rt-d.today{box-shadow:0 0 0 1.5px var(--accent);}
.rt-day-pick{display:flex;gap:5px;flex-wrap:wrap;}
.rt-day-pick button{border:1.5px solid var(--border);background:#fff;color:var(--dim);font-size:12px;font-weight:700;width:34px;height:34px;border-radius:9px;cursor:pointer;font-family:inherit;}
.rt-day-pick button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.tl-move{display:flex;flex-wrap:wrap;gap:5px;padding:7px 2px 4px;}
.tl-screen{max-width:680px;}
/* ── 모바일 더보기 메뉴 ── */
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:4px;}
.more-item{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);background:var(--bg);border-radius:14px;padding:13px 14px;font-size:14.5px;font-weight:800;color:var(--text);cursor:pointer;font-family:inherit;text-align:left;}
.more-item.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);}
.more-item .nav-ic{width:20px;height:20px;flex-shrink:0;}
.more-item>span{flex:1;min-width:0;}
/* ── 상세 화면 (프로젝트/루틴) ── */
.proj-name[data-projopen]{cursor:pointer;}
.proj-name[data-projopen]:hover{text-decoration:underline;}
.rt-body[data-rtopen]{cursor:pointer;}
.detail-back{display:inline-flex;align-items:center;gap:4px;border:none;background:transparent;color:var(--mid);font-size:13px;font-weight:700;cursor:pointer;padding:2px 0;margin-bottom:12px;font-family:inherit;}
.detail-back .nav-ic{width:16px;height:16px;}
.detail-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.detail-dot{width:26px;height:26px;border-radius:8px;flex-shrink:0;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--border);padding:0;}
.detail-name{flex:1;min-width:0;border:1.5px solid transparent;background:transparent;border-radius:10px;padding:5px 8px;font-size:20px;font-weight:900;color:var(--text);outline:none;font-family:inherit;}
.detail-name:hover{background:var(--bg);}
.detail-name:focus{border-color:var(--accent);background:#fff;}
.detail-memo{width:100%;border:1.5px solid var(--border);background:#fff;border-radius:13px;padding:11px 13px;font-size:14px;line-height:1.5;color:var(--text);outline:none;font-family:inherit;resize:vertical;min-height:64px;margin-bottom:14px;}
.detail-memo:focus{border-color:var(--accent);}
.detail-due{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--mid);}
.proj-color-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.proj-color-pick button{width:30px;height:30px;border-radius:9px;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--border);cursor:pointer;padding:0;}
.proj-color-pick button.on{box-shadow:0 0 0 2.5px var(--accent);}
.heat-wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.heat-wd span{text-align:center;font-size:10px;font-weight:800;color:var(--dim);}
.heat-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.heat-c{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-radius:8px;background:var(--bg);color:var(--faint);}
.heat-c.blank{background:transparent;}
.heat-c.due{color:var(--mid);box-shadow:inset 0 0 0 1.5px var(--border);}
.heat-c.on{background:var(--accent);color:#fff;}
.heat-c.today{box-shadow:0 0 0 2px var(--accent);}
/* ── 아이콘 레일 사이드바 (데스크톱) ── */
.side{width:68px;padding:18px 10px;align-items:center;gap:10px;}
.brand{justify-content:center;}
.brand-t{display:none;}
.avatar{width:42px;height:42px;}
.side-add{display:none;}
.side-sep{width:100%;}
.side-label{display:none;}
.side-nav{width:100%;align-items:stretch;}
.nav-item{justify-content:center;padding:11px 0;gap:0;position:relative;}
.nav-txt{display:none;}
.nav-item .nav-badge{position:absolute;top:4px;right:11px;margin:0;min-width:8px;width:8px;height:8px;padding:0;font-size:0;line-height:0;border-radius:50%;}
.side-sub{align-items:stretch;padding-left:0;}
.user-box{align-items:center;width:100%;}
.user-email{display:none;}
.logout-btn,.manage-btn{width:44px;height:44px;padding:0;justify-content:center;gap:0;}
.local-hint{font-size:0;}
.side-toggle{display:none;}
/* ── 메인 상단 빠른 입력 (데스크톱) ── */
.main-add{display:flex;gap:8px;margin-bottom:9px;}
.main-add .add-input{flex:1;}
.main-add .add-btn{padding:0 18px;flex-shrink:0;white-space:nowrap;}
.main-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.search-input{width:100%;border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:10px 14px;font-size:14px;outline:none;color:var(--text);margin-bottom:16px;font-family:inherit;}
.search-input:focus{border-color:var(--accent);}
@media(max-width:859px){
  .side{display:none;}
  .main-add,.main-chips{display:none;}
  .main{padding:16px 14px 110px;}
  .mhead{display:block;margin-bottom:16px;}
  .mhead-top{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
  .mhead-t{font-size:18px;font-weight:900;}
  .mhead-s{font-size:11.5px;font-weight:600;color:var(--dim);margin-top:2px;}
  .m-add{display:flex;gap:8px;}
  .m-add .add-input{flex:1;}
  .m-add .add-btn{padding:0 20px;flex-shrink:0;}
  .m-chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .board{grid-template-columns:1fr;}
  .tasks-layout.with-tl{grid-template-columns:1fr;}
  .timeline-col{position:static;}
  .controls{flex-wrap:wrap;}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:66px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--border);z-index:400;}
  .tab-item{flex:1;border:none;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;position:relative;}
  .tab-lbl{font-size:10px;font-weight:800;color:var(--mid);}
  .tab-item.on .tab-lbl{color:var(--accent);}
  .tab-badge{position:absolute;top:8px;right:50%;margin-right:-22px;background:#F43F5E;color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:1px 5px;}
}
@media(min-width:860px){.mhead{display:none;}.fab{display:none;}.tabbar{display:none;}}
/* ── 모바일 동기화 배너 ── */
.mob-sync{display:none;position:fixed;top:0;left:0;right:0;z-index:800;font-size:12px;font-weight:700;text-align:center;padding:8px 12px;line-height:1.4;}
.mob-sync.err{display:block;background:#FFF6E9;color:#C77B22;border-bottom:1px solid #F5D9A8;}
.mob-sync.off{display:block;background:#F5F5F5;color:var(--dim);border-bottom:1px solid var(--border);}
@media(min-width:860px){.mob-sync{display:none!important;}}

/* ── 토스트 ── */
.toast{position:fixed;left:50%;bottom:84px;transform:translate(-50%,16px);background:var(--ink,#3D3530);color:#fff;font-size:13.5px;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.22);z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center;}
.toast.on{opacity:1;transform:translate(-50%,0);}
@media(min-width:860px){.toast{bottom:32px;}}

/* ── 블롭 마스코트 ── */
.blob-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:22px 10px;}
.blob{width:96px;height:96px;display:block;}
.blob-say{font-size:13.5px;font-weight:800;color:var(--mid);line-height:1.5;white-space:pre-line;}
.blob-sm .blob{width:60px;height:60px;}

/* ── 새 프로젝트 마법사 ── */
.np-backdrop{position:fixed;inset:0;background:rgba(61,53,48,.42);z-index:1500;display:flex;align-items:center;justify-content:center;padding:18px;}
.np{position:relative;width:100%;max-width:440px;background:var(--bg);border-radius:24px;padding:24px 22px 26px;box-shadow:0 12px 48px rgba(0,0,0,.24);max-height:92vh;overflow-y:auto;animation:npin .2s ease;}
@keyframes npin{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}
@media(prefers-reduced-motion:reduce){.np{animation:none;}}
.np-x{position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:var(--card,#fff);border-radius:50%;color:var(--dim);font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08);}
.np-back{border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:800;cursor:pointer;padding:2px 0 12px;font-family:inherit;}
.np-h{font-size:21px;font-weight:900;color:var(--text);margin-bottom:4px;}
.np-sub{font-size:13px;font-weight:700;color:var(--faint);margin-bottom:18px;line-height:1.5;}
.np-cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.np-cat{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--border);background:var(--card,#fff);border-radius:18px;padding:20px 10px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:800;color:var(--text);transition:border-color .12s,transform .08s;}
.np-cat:hover{border-color:var(--accent);}
.np-cat:active{transform:scale(.97);}
.np-cat-emoji{font-size:30px;line-height:1;}
.np-opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1.5px solid var(--border);background:var(--card,#fff);border-radius:16px;padding:14px 15px;margin-bottom:10px;cursor:pointer;font-family:inherit;transition:border-color .12s;}
.np-opt:hover{border-color:var(--accent);}
.np-opt-emoji{font-size:26px;line-height:1;flex-shrink:0;}
.np-opt .opt-title{font-size:15px;font-weight:800;color:var(--text);}
.np-opt .opt-sub{font-size:12px;font-weight:700;color:var(--faint);margin-top:2px;}
.np-mine-tag{font-size:10.5px;font-weight:800;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px;}
.np-opt-row{display:flex;align-items:stretch;gap:7px;margin-bottom:10px;}
.np-opt-row .np-opt{flex:1;margin-bottom:0;}
.np-opt-del{flex-shrink:0;border:1.5px solid var(--border);background:var(--card,#fff);color:var(--faint);font-size:17px;font-weight:800;border-radius:13px;padding:0 14px;cursor:pointer;font-family:inherit;}
.np-opt-del:hover{border-color:#E88AA6;color:#E04560;}
.np-field{margin-bottom:14px;}
.np-label{display:block;font-size:12px;font-weight:800;color:var(--mid);margin-bottom:6px;}
.np-name-input{width:100%;border:1.5px solid var(--border);background:var(--card,#fff);border-radius:13px;padding:12px 14px;font-size:16px;font-weight:800;color:var(--text);outline:none;font-family:inherit;}
.np-name-input:focus{border-color:var(--accent);}
.np-start{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--accent-soft);border-radius:13px;padding:11px 13px;margin-bottom:16px;}
.np-start-lbl{font-size:13px;font-weight:800;color:var(--mid);}
.np-start input{border:1.5px solid var(--border);background:var(--card,#fff);border-radius:10px;padding:7px 10px;font-size:13px;font-family:inherit;color:var(--text);}
.np-start-hint{font-size:11.5px;font-weight:700;color:var(--faint);}
.np-steps{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.np-step{display:flex;align-items:center;gap:8px;background:var(--card,#fff);border:1.5px solid var(--border);border-radius:13px;padding:9px 11px;}
.np-step-n{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.np-step-title{flex:1;min-width:0;border:none;background:transparent;font-size:14px;font-weight:700;color:var(--text);outline:none;font-family:inherit;}
.np-step-date{border:1px solid var(--border);background:var(--bg);border-radius:8px;padding:5px 7px;font-size:11.5px;font-family:inherit;color:var(--mid);flex-shrink:0;}
.np-step-x{flex-shrink:0;border:none;background:transparent;color:var(--faint);font-size:16px;font-weight:800;cursor:pointer;padding:0 2px;}

.np-go{width:100%;border:none;background:var(--accent);color:#fff;font-size:15.5px;font-weight:900;padding:15px;border-radius:15px;cursor:pointer;font-family:inherit;box-shadow:0 4px 16px rgba(var(--accent-rgb),.3);}
.np-go:active{transform:scale(.99);}
.np-empty-steps{font-size:12.5px;font-weight:700;color:var(--faint);padding:8px 2px 14px;}

.c-proj-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0;}

.proj-soft{font-size:12px;font-weight:800;color:var(--accent);margin-bottom:10px;}

.proj-detail-status{display:flex;justify-content:center;margin:2px 0 14px;}
.proj-detail-status .blob-wrap{padding:6px 8px;}
.proj-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.proj-act{flex:1;min-width:130px;border:1.5px solid var(--border);background:var(--card,#fff);color:var(--mid);font-size:13px;font-weight:800;padding:11px;border-radius:12px;cursor:pointer;font-family:inherit;}
.proj-act:hover{border-color:var(--accent);color:var(--accent);}
/* 보관함 */
.proj-arch{margin-top:18px;border-top:1.5px dashed var(--border);padding-top:14px;}
.proj-arch-h{font-size:12.5px;font-weight:800;color:var(--faint);margin-bottom:9px;}
.proj-arch-item{display:flex;align-items:center;gap:9px;background:var(--card,#fff);border:1.5px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:7px;opacity:.75;}
.proj-arch-name{flex:1;min-width:0;font-size:13.5px;font-weight:800;color:var(--mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;}
/* 달력: 요약/빈 상태/드롭 하이라이트 */
.cal-summary{font-size:13px;font-weight:800;color:var(--mid);margin:-6px 0 12px;}

/* ══ 데이터 정규화 (신규 필드 하위호환) ═══════════════════════
   기존 데이터를 깨지 않고 새 필드를 채워 넣는다.
   - 할일(task): proj/date 기본 null, order(프로젝트 내 단계 순서) 채우기
   - 프로젝트(project): archived 기본 false, createdAt·cat·templateId 채우기
   - userTemplates: 항상 배열 보장
   * proj 가 곧 projectId(소속 프로젝트). 단독 할일이면 null = 기존 동작 그대로.
   로드 시점과 동기화 병합 직후에 호출한다. */
function normalizeData(){
  if(!Array.isArray(state.userTemplates)) state.userTemplates=[];
  // 프로젝트별 현재 최대 order 파악 → 비어있는 항목만 그 뒤로 채움
  var maxOrder={};
  state.tasks.forEach(function(t){
    var k=t.proj||PROJ_NONE;
    if(typeof t.order==="number" && (maxOrder[k]==null||t.order>maxOrder[k])) maxOrder[k]=t.order;
  });
  state.tasks.forEach(function(t){
    if(t.proj===undefined) t.proj=null;
    if(t.date===undefined) t.date=null;
    if(typeof t.order!=="number"){
      var k=t.proj||PROJ_NONE;
      maxOrder[k]=(maxOrder[k]==null?0:maxOrder[k]+1);
      t.order=maxOrder[k];
    }
  });
  state.projects.forEach(function(p){
    if(typeof p.archived!=="boolean") p.archived=false;
    if(!p.createdAt) p.createdAt=new Date().toISOString();
    if(p.cat===undefined) p.cat=null;
    if(p.templateId===undefined) p.templateId=null;
  });
}
normalizeData();

/* ══ 병합 / 백업 (기기 간 데이터 유실 방지) ══ */
function byId(x){ return x&&x.id!=null ? x.id : undefined; }
function byName(x){ return x&&x.name!=null ? x.name : undefined; }
// primary(최신 쪽)의 내용·순서를 기준으로, secondary에만 있는 항목을 뒤에 덧붙임.
// → 어느 기기에서 추가한 항목도 동기화 때 사라지지 않음.
function mergeByKey(primary, secondary, keyFn){
  if(!Array.isArray(primary)) return Array.isArray(secondary)?secondary.slice():[];
  if(!Array.isArray(secondary)) return primary.slice();
  var seen={}, out=[];
  primary.forEach(function(x){ var k=keyFn(x); if(k!==undefined) seen[k]=true; out.push(x); });
  secondary.forEach(function(x){ var k=keyFn(x); if(k!==undefined && !seen[k]) out.push(x); });
  return out;
}
function recalcMaxId(){
  var maxn=100; state.tasks.forEach(function(x){ var n=parseInt(x.id,10); if(!isNaN(n)&&n>maxn) maxn=n; }); _id=maxn;

function snapshotBackup(){
  try{
    localStorage.setItem(KEY_BACKUP, JSON.stringify({
      tasks:state.tasks, cats:state.cats, projects:state.projects, routines:state.routines,
      memos:state.memos, diary:state.diary, userTemplates:state.userTemplates,

}

/* ══ Supabase 동기화 ══ */
async function syncOnLoad(){
  if(!currentUser||!sb) return;
  setSync("syncing");
  try{
    var res=await sb.from("user_data").select("*").eq("user_id",currentUser.id).single();
    if(res.error && res.error.code==="PGRST116"){
      // 첫 로그인: 로컬 데이터를 서버로 올림
      await pushToServer(); return;
    }
    if(res.error) throw res.error;
    var srv=res.data;
    var serverTs=srv.updated_at ? new Date(srv.updated_at).getTime() : 0;
    var localTs=localStorage.getItem(KEY_TS) ? new Date(localStorage.getItem(KEY_TS)).getTime() : 0;
    var serverNewer=serverTs>=localTs;
    snapshotBackup();   // 합치기 전 현재 로컬 보관
    // 최신 쪽을 기준으로 두고, 다른 기기에만 있던 항목은 보존(병합).
    var sTasks=Array.isArray(srv.tasks)?srv.tasks:[];
    var sCats =(Array.isArray(srv.cats)&&srv.cats.length)?srv.cats:[];
    var sProj =Array.isArray(srv.projects)?srv.projects:[];
    var sRt   =Array.isArray(srv.routines)?srv.routines:[];
    var sMemo =Array.isArray(srv.memos)?srv.memos:[];
    var sDiary=Array.isArray(srv.diary)?srv.diary:[];
    var sUtpl =Array.isArray(srv.user_templates)?srv.user_templates:[];
    // localTs===0 이면 이 기기에 저장된 적 없음 → SEED 데이터를 서버에 섞지 않음
    var freshDevice = (localTs === 0);
    if(serverNewer){
      state.tasks    = freshDevice ? sTasks.slice() : mergeByKey(sTasks, state.tasks, byId);
      if(sCats.length) state.cats = freshDevice ? sCats.slice() : mergeByKey(sCats, state.cats, byName);
      state.projects = freshDevice ? sProj.slice() : mergeByKey(sProj, state.projects, byId);
      state.routines = freshDevice ? sRt.slice()   : mergeByKey(sRt, state.routines, byId);
      state.memos    = freshDevice ? sMemo.slice()  : mergeByKey(sMemo, state.memos, byId);
      state.diary    = freshDevice ? sDiary.slice() : mergeByKey(sDiary, state.diary, byId);
      state.userTemplates = freshDevice ? sUtpl.slice() : mergeByKey(sUtpl, state.userTemplates, byId);
      if(srv.theme){ state.theme=srv.theme; applyTheme(srv.theme); }
    } else {
      state.tasks    = mergeByKey(state.tasks, sTasks, byId);
      state.cats     = mergeByKey(state.cats, sCats, byName);
      state.projects = mergeByKey(state.projects, sProj, byId);
      state.routines = mergeByKey(state.routines, sRt, byId);
      state.memos    = mergeByKey(state.memos, sMemo, byId);
      state.diary    = mergeByKey(state.diary, sDiary, byId);
      state.userTemplates = mergeByKey(state.userTemplates, sUtpl, byId);
    }
    recalcMaxId();
    sanitizeColors();
    normalizeData();
    saveLocal();
    syncRetries=0; if(syncTimer){clearTimeout(syncTimer);syncTimer=null;}
    recalcMaxId_after_sync=false;
    await pushToServer();   // 합쳐진 결과를 서버에도 반영
  }catch(e){
    console.error('[syncOnLoad]', e);
    var code=String((e&&(e.code||e.status||e.statusCode))||"");
    var msg=String((e&&e.message)||e||"").slice(0,80);
    var detail=(code&&code!=="undefined"?code+" ":"")+(msg||"알 수 없는 오류");
    setSync(navigator.onLine?"error":"offline", detail);
    if(navigator.onLine) scheduleSyncRetry();
  }
}

// syncOnLoad 재시도 (서버→로컬 데이터 로드 실패 시)
var syncRetries=0, syncTimer=null;
function scheduleSyncRetry(){
  if(syncTimer) return;
  var delay=Math.min(30000, 2000*Math.pow(2,syncRetries));
  syncRetries=Math.min(syncRetries+1,4);
  syncTimer=setTimeout(function(){ syncTimer=null; syncOnLoad().then(function(){ render(); }); }, delay);
}

// pushToServer 재시도 (로컬→서버 업로드 실패 시)
var pushPending=false, pushTimer=null, pushRetries=0;
function scheduleRetry(){
  if(pushTimer) return;
  var delay=Math.min(30000, 2000*Math.pow(2,pushRetries));   // 2s · 4s · 8s · 16s · 30s
  pushRetries=Math.min(pushRetries+1,4);
  pushTimer=setTimeout(function(){ pushTimer=null; if(pushPending) pushToServer(); }, delay);
}
var recalcMaxId_after_sync=false;
async function pushToServer(){
  if(!currentUser||!sb) return false;
  if(!navigator.onLine){ pushPending=true; setSync("offline"); return false; }
  setSync("syncing");
  try{
    var res=await sb.from("user_data").upsert(
      { user_id:currentUser.id, tasks:state.tasks, cats:state.cats, projects:state.projects, routines:state.routines, memos:state.memos, diary:state.diary, user_templates:state.userTemplates, theme:state.theme, updated_at:new Date().toISOString() },
      { onConflict:"user_id" }
    );
    if(res.error) throw res.error;
    pushPending=false; pushRetries=0; setSync("idle"); return true;
  }catch(e){
    console.error('[pushToServer]', e);
    var code=String((e&&(e.code||e.status||e.statusCode))||"");
    var msg=String((e&&e.message)||e||"").slice(0,80);
    var detail=(code&&code!=="undefined"?code+" ":"")+(msg||"알 수 없는 오류");
    pushPending=true;
    setSync(navigator.onLine?"error":"offline", detail);
    scheduleRetry();
    return false;
  }
}
function save(){
  saveLocal();
  pushToServer();
}

/* ══ 위젯 빠른메모 큐 → 받은함으로 끌어오기 ══ */
async function drainInboxQueue(){
  if(!currentUser||!sb) return false;
  try{
    var res=await sb.from("inbox_queue").select("id,text,created_at").eq("user_id",currentUser.id).order("created_at",{ascending:true});
    if(res.error||!res.data||!res.data.length) return false;
    res.data.forEach(function(row){
      var v=(row.text||"").trim(); if(!v) return;
      state.tasks.unshift({ id:nid(), text:v, cat:UNCAT, bucket:"받은함", done:false, date:null });
    });
    var ids=res.data.map(function(r){return r.id;});
    await sb.from("inbox_queue").delete().in("id",ids);
    saveLocal(); await pushToServer();
    return true;
  }catch(e){ return false; }
}

function subscribeRealtime(){
  if(realtimeSub) sb.removeChannel(realtimeSub);
  realtimeSub=sb.channel("dash_"+currentUser.id)
    .on("postgres_changes",{ event:"INSERT", schema:"public", table:"inbox_queue", filter:"user_id=eq."+currentUser.id },
      function(){ drainInboxQueue().then(function(ok){ if(ok) render(); }); })
    .on("postgres_changes",{ event:"*", schema:"public", table:"user_data", filter:"user_id=eq."+currentUser.id },
      function(payload){
        if(!payload.new||!Array.isArray(payload.new.tasks)) return;
        var n=payload.new;
        var serverTs=n.updated_at ? new Date(n.updated_at).getTime() : 0;
        var localTs=localStorage.getItem(KEY_TS) ? new Date(localStorage.getItem(KEY_TS)).getTime() : 0;
        // 다른 기기에서 온 변경만 반영 (내가 방금 저장한 건 무시)
        if(serverTs>localTs+1000){
          snapshotBackup();
          // 들어온 변경을 기준으로 두되, 아직 못 올린 로컬 항목은 보존(병합)
          state.tasks = mergeByKey(n.tasks, state.tasks, byId);
          if(Array.isArray(n.cats)&&n.cats.length) state.cats = mergeByKey(n.cats, state.cats, byName);
          if(Array.isArray(n.projects)) state.projects = mergeByKey(n.projects, state.projects, byId);
          if(Array.isArray(n.routines)) state.routines = mergeByKey(n.routines, state.routines, byId);
          if(Array.isArray(n.memos)) state.memos = mergeByKey(n.memos, state.memos, byId);
          if(Array.isArray(n.diary)) state.diary = mergeByKey(n.diary, state.diary, byId);
          if(Array.isArray(n.user_templates)) state.userTemplates = mergeByKey(n.user_templates, state.userTemplates, byId);
          if(n.theme){ state.theme=n.theme; applyTheme(n.theme); }
          normalizeData();
          recalcMaxId(); saveLocal(); render();
        }
      })
    .subscribe();
}

function authErrKo(msg){
  if(!msg) return "오류가 발생했어";
  if(msg.includes("Invalid login credentials")) return "이메일 또는 비밀번호가 틀렸어";
  if(msg.includes("Email not confirmed"))        return "이메일 인증이 필요해 — 메일함을 확인해봐";
  if(msg.includes("User already registered"))    return "이미 가입된 이메일이야";
  if(msg.includes("Password should be at least"))return "비밀번호는 8자 이상이어야 해";
  if(msg.includes("rate limit"))                 return "잠시 후 다시 시도해봐";
  return msg;
}

async function handleAuthSubmit(){
  var email=document.getElementById("authEmail").value.trim();
  var pw=document.getElementById("authPw").value;
  if(!email){ setAuthErr("이메일을 입력해줘"); return; }
  if(pw.length<8){ setAuthErr("비밀번호는 8자 이상이어야 해"); return; }
  try{ localStorage.setItem(KEY_EMAIL,email); }catch(_){}
  var btn=document.getElementById("authSubmit");
  btn.disabled=true; btn.textContent="잠깐만...";
  try{
    var result=authIsSignup
      ? await sb.auth.signUp({ email:email, password:pw })
      : await sb.auth.signInWithPassword({ email:email, password:pw });
    if(result.error){
      setAuthErr(authErrKo(result.error.message));
    } else if(authIsSignup && result.data.user && !result.data.session){
      setAuthErr("확인 이메일을 보냈어! 메일함에서 링크를 눌러줘 ✉️", true);
    }

  }catch(e){ setAuthErr("오류가 발생했어. 다시 시도해봐"); }
  btn.disabled=false;
  btn.textContent=authIsSignup?"계정 만들기":"로그인";
}

async function init(){

    // Supabase 미설정, 또는 CDN 차단으로 라이브러리 로드 실패 → 로컬 전용

      : "📴 로컬 전용 모드";

    render(); setupSW(); return;
  }
  // 먼저 로컬 캐시로 화면 표시 (빠른 로딩)
  var sess=await sb.auth.getSession();

  } else {
    showAuth(false);
  }
  sb.auth.onAuthStateChange(async function(event,session){
    if(event==="SIGNED_IN"&&session){
      currentUser=session.user;
      document.getElementById("authOverlay").style.display="none";
      document.getElementById("app").style.display="block";
      showUserBox(currentUser.email);

      document.getElementById("app").style.display="none";
      showAuth(false);
    }
  });

  else { eyes='<circle cx="22" cy="31" r="3" fill="#3D3530"/><circle cx="38" cy="31" r="3" fill="#3D3530"/>'; mouth='<path d="M25 39 q3 2 6 0" stroke="#3D3530" stroke-width="2.2" fill="none" stroke-linecap="round"/>'; }
  var svg='<svg class="blob" viewBox="0 0 56 64" fill="none" xmlns="http://www.w3.org/2000/svg">'
    +'<path d="M20 6 q4 -5 8 0 q1 5 -4 7 q-5 -2 -4 -7z" fill="#86EFAC"/><path d="M28 6 l0 8" stroke="#4ADE80" stroke-width="2" stroke-linecap="round"/>'

/* ── 밀린 일정 / 타임라인 ── */
function dayDiff(a,b){ return Math.round((new Date(a+"T00:00:00")-new Date(b+"T00:00:00"))/86400000); }
function overdueDays(t){ if(!t.date||t.done) return 0; var d=dayDiff(TODAY,t.date); return d>0?d:0; }
function overdueTasks(){ return state.tasks.filter(function(t){return overdueDays(t)>0;}); }

  state.tasks=state.tasks.map(function(t){return ids.indexOf(t.id)>=0?Object.assign({},t,{date:TODAY,bucket:"오늘"}):t;}); save(); render(); }
function toggleTL(){ state.tlOn=!state.tlOn; saveTL(); render(); }

function addCat(){
  var usedDots={}; state.cats.forEach(function(c){ usedDots[c.dot]=1; });
  var pal=PALETTE.filter(function(p){ return !usedDots[p.dot]; })[0] || PALETTE[state.cats.length%PALETTE.length];
  var names={}; state.cats.forEach(function(c){ names[c.name]=1; });
  var base="새 분류", name=base, i=2;
  while(names[name]||name===UNCAT){ name=base+i; i++; }
  state.cats.push({ name:name, dot:pal.dot, chip:pal.chip, text:pal.text });
  save(); render();
}
function renameCat(idx,newName){
  newName=(newName||"").trim();
  var c=state.cats[idx]; if(!c){ render(); return; }
  var old=c.name;
  if(!newName||newName===old){ render(); return; }
  if(newName===UNCAT){ render(); return; }
  if(state.cats.some(function(x,i){ return i!==idx && x.name===newName; })){ render(); return; }
  c.name=newName;
  state.tasks=state.tasks.map(function(t){ return t.cat===old?Object.assign({},t,{cat:newName}):t; });
  if(state.newCat===old) state.newCat=newName;
  save(); render();
}

  var p=PALETTE[palIdx], c=state.cats[idx]; if(!p||!c) return;
  c.dot=p.dot; c.chip=p.chip; c.text=p.text;
  state.colorFor=null; save(); render();
}
function deleteCat(idx){
  var c=state.cats[idx]; if(!c) return;
  state.tasks=state.tasks.map(function(t){ return t.cat===c.name?Object.assign({},t,{cat:UNCAT}):t; });
  if(state.newCat===c.name) state.newCat=UNCAT;
  state.cats.splice(idx,1);
  save(); render();
}

function addTaskToProject(pid,text){

// 프로젝트의 단계들을 '내 템플릿'으로 저장 (기획서 §6-4·§7)
function saveProjectAsTemplate(pid){
  var p=projById(pid); if(!p) return;
  var ts=projTasks(pid).slice().sort(function(a,b){return (a.order||0)-(b.order||0);});
  if(!ts.length){ toast("저장할 단계가 없어요"); return; }
  // 기준일 = 단계 중 가장 이른 날짜(없으면 오늘). 각 단계는 기준일+N일 → offsetDays.
  var dated=ts.filter(function(t){return t.date;}).map(function(t){return t.date;}).sort();
  var base=dated.length?dated[0]:TODAY;
  var steps=ts.map(function(t){ return { title:t.text, offsetDays:t.date?Math.max(0,dayDiff(t.date,base)):0 }; });
  var tpl={ id:"ut"+nid(), name:p.name, cat:p.cat||"개인", emoji:npEmoji(p.cat||"개인"), steps:steps, createdAt:new Date().toISOString() };

  render();
}

   있으면(다른 기기에서 깔았거나 직접 만들었으면) 건너뜀. */
function seedOnboardingProject(){
  var tpl=tplById("blog-adsense")||TEMPLATES[0]; if(!tpl||!(tpl.steps||[]).length) return null;
  var pid="p"+nid();
  var col=catStyle(tpl.cat).dot || PALETTE[0].dot;
  state.projects.push({ id:pid, name:"✨ 예시: "+tpl.name, color:col, cat:tpl.cat, templateId:tpl.id, createdAt:new Date().toISOString(), archived:false, example:true });
  for(var i=tpl.steps.length-1;i>=0;i--){
    var s=tpl.steps[i], ds=stepDate(s.offsetDays, TODAY);
    state.tasks.unshift({ id:nid(), text:s.title, cat:tpl.cat, bucket:bucketForDate(ds), done:false, date:ds, proj:pid, order:i });
  }
  var last=tpl.steps[tpl.steps.length-1], pp=projById(pid);
  if(pp&&last) pp.due=stepDate(last.offsetDays, TODAY);
  return pid;
}
function maybeSeedOnboarding(){
  try{ if(localStorage.getItem(KEY_ONBOARD)) return; }catch(e){ return; }

}

function rtById(id){ return state.routines.filter(function(r){return r.id===id;})[0]||null; }
function addRoutine(name){

function toggleRoutine(id){
  var r=rtById(id); if(!r) return;
  r.log=r.log||{}; if(r.log[TODAY]) delete r.log[TODAY]; else r.log[TODAY]=true;
  save(); render();
}
function toggleRoutineDay(id,dow){
  var r=rtById(id); if(!r) return; r.days=r.days||[];
  var i=r.days.indexOf(dow); if(i>=0) r.days.splice(i,1); else r.days.push(dow);
  save(); render();
}
function routineStreak(r){
  var log=r.log||{}, streak=0, d=new Date(); d.setHours(0,0,0,0);
  // 오늘 미완료면 어제부터 카운트
  if(!log[ymd(d)]) d.setDate(d.getDate()-1);
  for(var i=0;i<400;i++){
    var ds=ymd(d), dow=d.getDay();
    var due=(r.days||[]).indexOf(dow)>=0;
    if(due){ if(log[ds]) streak++; else break; }
    d.setDate(d.getDate()-1);
  }
  return streak;
}
function routineBestStreak(r){
  var log=r.log||{}, best=0, cur=0, d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-400);
  for(var i=0;i<401;i++){
    var ds=ymd(d), dow=d.getDay(), due=(r.days||[]).indexOf(dow)>=0;
    if(due){ if(log[ds]){ cur++; if(cur>best) best=cur; } else cur=0; }
    d.setDate(d.getDate()+1);
  }
  return best;
}
function routineRate(r,nDays){
  var log=r.log||{}, due=0, hit=0, d=new Date(); d.setHours(0,0,0,0);
  for(var i=0;i<nDays;i++){
    var ds=ymd(d), dow=d.getDay();
    if((r.days||[]).indexOf(dow)>=0){ due++; if(log[ds]) hit++; }
    d.setDate(d.getDate()-1);
  }
  return due?Math.round(hit/due*100):0;
}

function tlMiniCard(t){

    +'<span class="cdot" style="background:'+catStyle(t.cat).dot+'"></span></div>'+tlMovePicker(t);

function tlClock(){
  var items=todayTimed();
  var untimed=items.filter(function(t){return !t.time;});
  var timed=items.filter(function(t){return t.time;});
  var hint=items.length===0?'<div class="tl-hint">할 일을 시간칸으로 끌어다 놓으면 오늘 일정으로 잡혀요 🕐</div>':"";
  var hours=timed.map(hourOf).filter(function(h){return h!==null;});
  var start=hours.length?Math.min.apply(null,hours):9;
  var end=hours.length?Math.max.apply(null,hours)+1:18;
  if(start>8) start=8; if(start<0) start=0; if(end<19) end=19; if(end>23) end=23; if(end<=start) end=start+1;
  var rows="";
  for(var h=start;h<=end;h++){
    var hh=(h<10?"0":"")+h+":00";
    var inHour=timed.filter(function(t){return hourOf(t)===h;});
    var blocks=inHour.map(function(t){
      return '<div class="tl-block'+(t.done?" done":"")+'" style="border-color:'+catStyle(t.cat).dot+'">'
        +'<button class="round '+(t.done?"done":"")+'" data-toggle="'+t.id+'">'+(t.done?"✓":"")+"</button>"
        +'<span class="tl-btext '+(t.done?"strike":"")+'" data-edit="'+t.id+'">'+esc(t.text)+"</span>"
        +'<span class="tl-bt">'+esc(t.time)+(t.end?"–"+esc(t.end):"")+"</span></div>"+tlMovePicker(t);
    }).join("");
    rows+='<div class="tl-hour" data-tlhour="'+h+'"><span class="tl-time">'+hh+'</span><div class="tl-slot">'+blocks+'</div></div>';
  }
  var pool=untimed.length?'<div class="tl-pool"><div class="tl-pool-h">시간 미정 '+untimed.length+'개</div>'+untimed.map(tlMiniCard).join("")+'</div>':"";
  return hint+'<div class="tl-clock">'+rows+'</div>'+pool;
}
function tlAgenda(){
  var items=todayTimed().slice().sort(function(a,b){
    var ta=a.time||"99:99", tb=b.time||"99:99"; return ta<tb?-1:ta>tb?1:0;
  });
  if(items.length===0) return '<div class="tl-empty">오늘 할 일이 없어요. 🌿</div>';
  return '<div class="tl-agenda">'+items.map(function(t){
    var tm=t.time?'<span class="tl-bt">'+esc(t.time)+"</span>":'<span class="tl-bt tl-bt-no">시간 미정</span>';
    return '<div class="tl-item'+(t.done?" done":"")+'">'
      +'<button class="round '+(t.done?"done":"")+'" data-toggle="'+t.id+'">'+(t.done?"✓":"")+"</button>"
      +'<span class="tl-itext '+(t.done?"strike":"")+'" data-edit="'+t.id+'">'+esc(t.text)+"</span>"
      +tm+'<span class="cdot" style="background:'+catStyle(t.cat).dot+'"></span></div>'+tlMovePicker(t);
  }).join("")+"</div>";
}

function calLabel(dstr){

function calFull(ds){ var p=ds.split("-"); var dow=new Date(+p[0],+p[1]-1,+p[2]).getDay(); return parseInt(p[1],10)+"월 "+parseInt(p[2],10)+"일 ("+WD[dow]+")"+(ds===TODAY?" · 오늘":""); }
function screenCalendar(){
  var y=state.calY,m=state.calM;
  var startDow=new Date(y,m,1).getDay();
  var daysIn=new Date(y,m+1,0).getDate();
  var cells=[];
  for(var i=0;i<startDow;i++) cells.push(null);
  for(var d=1;d<=daysIn;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  var byDate={};
  state.tasks.forEach(function(t){ if(t.date)(byDate[t.date]=byDate[t.date]||[]).push(t); });
  var dueBy={};
  liveProjects().forEach(function(p){ if(p.due)(dueBy[p.due]=dueBy[p.due]||[]).push(p); });
  var grid=cells.map(function(c){
    if(c===null) return '<div class="cal-day blank"></div>';
    var ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(c).padStart(2,"0");
    var dow=new Date(y,m,c).getDay();
    var dots=(byDate[ds]||[]).slice(0,4).map(function(t){return'<span class="cdot" style="background:'+taskDotColor(t)+'"></span>';}).join("");
    var flags=(dueBy[ds]||[]).slice(0,3).map(function(p){return'<span class="cal-flag" style="background:'+p.color+'"></span>';}).join("");
    var cls="cal-day"+(ds===TODAY?" today":"")+(ds===state.calSel?" sel":"")+(dow===0?" cal-sun":"");
    return'<button class="'+cls+'" data-calday="'+ds+'"><span class="dnum">'+c+'</span>'+(flags?'<span class="cal-flags">'+flags+'</span>':"")+'<span class="cal-dots">'+dots+"</span></button>";
  }).join("");
  var selList=byDate[state.calSel]||[];
  var selDue=dueBy[state.calSel]||[];
  var dueHTML=selDue.map(function(p){return '<div class="p-item" style="border-color:'+p.color+'"><span class="proj-dot" style="background:'+p.color+'"></span><span class="p-text" data-projopen="'+p.id+'" style="cursor:pointer">📌 '+esc(p.name)+' 마감</span></div>';}).join("");
  var selHTML=(selList.length===0&&selDue.length===0)?'<div class="empty">이 날엔 아직 일정이 없어. 아래에 적어봐.</div>'
    :dueHTML+selList.map(function(t,idx){return cardHTML(t,selList[idx+1]?selList[idx+1].id:"");}).join("");
  // 이번 달 한 줄 요약 (기획서 §6-2)
  var monthPrefix=y+"-"+String(m+1).padStart(2,"0");
  var monthTasks=state.tasks.filter(function(t){return t.date&&t.date.indexOf(monthPrefix)===0;});
  var monthDone=monthTasks.filter(function(t){return t.done;}).length;
  var summary=monthTasks.length
    ? '<div class="cal-summary">이번 달 할 일 <b>'+monthTasks.length+'개</b> · 완료 <b>'+monthDone+'개</b></div>'
    : '<div class="cal-summary muted">이번 달은 아직 일정이 없어요</div>';
  // 어디에도 날짜 있는 할 일이 없으면: 블롭이 다음 행동 안내
  var anyDated=state.tasks.some(function(t){return t.date;});
  var emptyCTA=anyDated?"":'<div class="cal-empty-cta">'+blob("peek","아직 일정이 없어요.\n새 프로젝트를 시작해볼까요?")+'<button class="np-new-btn" data-npnew>✨ 새 프로젝트 시작하기</button></div>';
  return'<div class="screen-title">📅 일정</div>'+summary+emptyCTA
    +'<div class="cal"><div class="cal-head"><button class="cal-nav" data-calprev>‹</button>'
    +'<span class="cal-title">'+y+"년 "+(m+1)+"월</span>"
    +'<button class="cal-nav" data-calnext>›</button>'
    +'<button class="cal-today" data-caltoday>오늘로</button></div>'
    +'<div class="cal-wd">'+WD.map(function(w){return"<span>"+w+"</span>";}).join("")+"</div>"
    +'<div class="cal-grid">'+grid+"</div>"
    +'<div class="daylist"><div class="daylist-h">'+calFull(state.calSel)+"</div>"+selHTML
    +'<div class="dayadd"><input id="dayInput" class="add-input" placeholder="이 날 할 일 추가"><button class="add-btn" id="dayAddBtn">추가</button></div>'
    +"</div></div>";
}

  var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a"); a.href=url; a.download="dashboard-backup-"+TODAY+".json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}
function importData(file){
  if(!file) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!confirm("현재 데이터를 백업 파일 내용으로 덮어쓸까?")) return;
      if(Array.isArray(d.tasks)) state.tasks=d.tasks;
      if(Array.isArray(d.cats)&&d.cats.length) state.cats=d.cats;
      if(Array.isArray(d.projects)) state.projects=d.projects;
      if(Array.isArray(d.routines)) state.routines=d.routines;
      if(Array.isArray(d.memos)) state.memos=d.memos;
      if(Array.isArray(d.diary)) state.diary=d.diary;
      if(Array.isArray(d.userTemplates)) state.userTemplates=d.userTemplates;
      if(d.theme){ state.theme=d.theme; applyTheme(d.theme); }
      sanitizeColors();
      normalizeData();
      var maxn=100; state.tasks.forEach(function(x){var n=parseInt(x.id,10);if(!isNaN(n)&&n>maxn)maxn=n;}); _id=maxn;
      state.settings=false; save(); render(); alert("가져오기 완료!");
    }catch(e){ alert("파일을 읽을 수 없어. JSON 백업 파일이 맞는지 확인해줘."); }
  };
  rd.readAsText(file);
}

function screenStats(){
  var all=state.tasks.length;
  var done=state.tasks.filter(function(t){return t.done;}).length;
  var rate=all?Math.round(done/all*100):0;
  // 도넛
  var R=42,C=2*Math.PI*R,off=C*(1-rate/100);
  var ring='<div class="ring-wrap"><svg class="ring" width="108" height="108" viewBox="0 0 108 108">'
    +'<circle cx="54" cy="54" r="'+R+'" fill="none" stroke="var(--bg)" stroke-width="12"/>'
    +'<circle cx="54" cy="54" r="'+R+'" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" transform="rotate(-90 54 54)"/>'
    +'<text x="54" y="60" text-anchor="middle" font-size="22" font-weight="900" fill="var(--text)">'+rate+'%</text></svg>'
    +'<div class="ring-c">전체 <b>'+all+'</b>개 중<br>완료 <b>'+done+'</b>개<br>남은 일 <b>'+(all-done)+'</b>개</div></div>';
  var ringBlock='<div class="sum-block"><div class="sum-block-h">'+ic("stats")+'완료율</div>'+ring+'</div>';
  // 카테고리별
  var cats=CAT_KEYS_LIST();
  var maxC=Math.max.apply(null,cats.map(function(k){return state.tasks.filter(function(t){return (t.cat||UNCAT)===k;}).length;}).concat([1]));
  var catRows=cats.map(function(k){
    var n=state.tasks.filter(function(t){return (t.cat||UNCAT)===k;}).length;
    var sty=catStyle(k);
    return '<div class="stat-bar-row"><span class="stat-bar-name"><span class="cdot" style="background:'+sty.dot+'"></span>'+esc(k)+'</span>'
      +'<span class="stat-bar-track"><span class="stat-bar-fill" style="width:'+(n/maxC*100)+'%;background:'+sty.dot+'"></span></span>'
      +'<span class="stat-bar-val">'+n+'개</span></div>';
  }).join("");
  var catBlock='<div class="sum-block"><div class="sum-block-h">'+ic("cat")+'카테고리별</div>'+catRows+'</div>';
  // 우선순위별
  var maxB=Math.max.apply(null,BUCKET_KEYS.map(function(k){return state.tasks.filter(function(t){return t.bucket===k;}).length;}).concat([1]));
  var bRows=BUCKET_KEYS.map(function(k){
    var n=state.tasks.filter(function(t){return t.bucket===k;}).length;
    return '<div class="stat-bar-row"><span class="stat-bar-name">'+BUCKETS[k].label+'</span>'
      +'<span class="stat-bar-track"><span class="stat-bar-fill" style="width:'+(n/maxB*100)+'%;background:var(--accent)"></span></span>'
      +'<span class="stat-bar-val">'+n+'개</span></div>';
  }).join("");
  var bBlock='<div class="sum-block"><div class="sum-block-h">'+ic("bucket")+'우선순위별</div>'+bRows+'</div>';
  return '<div class="screen-title">'+ic("stats")+'통계</div>'+ringBlock+catBlock+bBlock;
}

  var rows=state.routines.map(function(r){
    var doneToday=r.log&&r.log[TODAY];
    var due=(r.days||[]).indexOf(dow)>=0;
    var streak=routineStreak(r);
    var dots="";
    for(var i=6;i>=0;i--){ var d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); var ds=ymd(d);
      var on=r.log&&r.log[ds]; dots+='<span class="rt-d'+(on?" on":"")+(i===0?" today":"")+'"></span>'; }
    var dayNames=(r.days||[]).length===7?"매일":(r.days||[]).slice().sort().map(function(d){return WD[d];}).join("·");
    return '<div class="rt-row" style="opacity:'+(due?1:.55)+'">'
      +'<button class="rt-check'+(doneToday?" done":"")+'" data-rttoggle="'+r.id+'">'+(doneToday?"✓":"")+'</button>'
      +'<div class="rt-body" data-rtopen="'+r.id+'"><div class="rt-name'+(doneToday?" done":"")+'">'+esc(r.name)+' <span style="color:var(--faint);font-weight:700">›</span></div>'
      +'<div class="rt-meta"><span>'+dayNames+'</span>'+(r.seq?'<span class="rt-seq">절차</span>':"")+(streak>0?'<span class="rt-streak">🔥 '+streak+'일 연속</span>':"")+'</div>'
      +'<div class="rt-dots">'+dots+'</div></div>'
      +'<button class="x" data-rtdel="'+r.id+'">×</button></div>';
  }).join("");
  return '<div class="screen-title">'+ic("routines")+'루틴</div>'+add+'<div class="rt-list">'+rows+'</div>';
}
function rtHeatmap(r){
  var nowd=new Date(), y=nowd.getFullYear(), m=nowd.getMonth();
  var startDow=new Date(y,m,1).getDay(), daysIn=new Date(y,m+1,0).getDate();
  var cells=[]; for(var i=0;i<startDow;i++) cells.push(null);
  for(var d=1;d<=daysIn;d++) cells.push(d);
  var grid=cells.map(function(c){
    if(c===null) return '<span class="heat-c blank"></span>';
    var ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(c).padStart(2,"0");
    var dow=new Date(y,m,c).getDay(), due=(r.days||[]).indexOf(dow)>=0, on=r.log&&r.log[ds];
    var cls=on?"on":(due?"due":"off");
    return '<span class="heat-c '+cls+(ds===TODAY?" today":"")+'">'+c+'</span>';
  }).join("");
  return '<div class="heat-wd">'+WD.map(function(w){return"<span>"+w+"</span>";}).join("")+'</div><div class="heat-grid">'+grid+'</div>';
}

  });
