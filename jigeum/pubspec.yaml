name: jigeum
description: "지금 · Now — 클린 아웃라이너 기반 목표달성 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  intl: ^0.19.0
  uuid: ^4.5.0
  # 노션 연동(REST) 호출용 HTTP 클라이언트.
  http: ^1.2.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  # home_widget 플러그인은 기기 크래시로 사용 안 함 — 위젯은 네이티브(MethodChannel) 직접 구현.
  # 구글 캘린더 연동도 같은 이유로 플러그인 없이 네이티브(CalendarContract) 직접 구현.
  # OAuth/GCP/SHA-1 불필요 — 폰에 이미 동기화된 구글 캘린더를 앱이 직접 읽고 쓴다.
  # (READ_CALENDAR/WRITE_CALENDAR 런타임 권한만 필요 → docs/google-calendar-setup.md)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

# 전이 의존성 jni 를 1.0.0 으로 고정 — 새로 배포된 jni 1.0.1 의 android/build.gradle
# (line 84 `kotlin()`)이 현재 Gradle 스캐폴드와 안 맞아 릴리즈 빌드가 깨진다.
# 1.0.0 은 동일 잠금(jni_flutter 1.0.1)에서 정상 빌드되던 버전. jni 가 gradle
# 을 고치면 이 override 제거 가능.
dependency_overrides:
  jni: 1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
    - family: NanumGothic
      fonts:
        - asset: assets/fonts/NanumGothic-Regular.ttf
          weight: 400
        - asset: assets/fonts/NanumGothic-Bold.ttf
          weight: 700
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Regular.ttf
    - family: NanumMyeongjo
      fonts:
        - asset: assets/fonts/NanumMyeongjo-Regular.ttf
          weight: 400
        - asset: assets/fonts/NanumMyeongjo-Bold.ttf
          weight: 700
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/NotoSerifKR-Medium.ttf
          weight: 500
